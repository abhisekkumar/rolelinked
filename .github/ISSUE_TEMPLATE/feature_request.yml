name: Feature Request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        > ⚠️ **Privacy first.** Issues are public. Never paste resumes, application records, recruiter messages, credentials, or private scan output. Use fictional examples.
  - type: checkboxes
    id: coc
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow the repository's Code of Conduct
          required: true
  - type: checkboxes
    id: search
    attributes:
      label: Existing issues
      options:
        - label: I searched existing issues and this hasn't been requested yet
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve? Why do you need this?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like this to work?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Hosted accounts / onboarding
        - Hosted Ask / model gateway
        - Scheduling / workers
        - Privacy / security
        - Evaluation / Scoring
        - Resume / document generation
        - Job discovery / sources
        - Pipeline / follow-ups
        - Interview preparation
        - Local / self-hosted edition
        - Language / i18n
        - Documentation
        - Other
    validations:
      required: true
