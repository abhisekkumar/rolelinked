name: Bug Report
description: Report a reproducible RoleLinked problem
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        > ⚠️ **Privacy first.** Issues are public. Never paste a resume, application record, recruiter message, connection export, credential, session token, or private scan output. Use fictional or redacted examples.
  - type: checkboxes
    id: coc
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow the repository's Code of Conduct
          required: true
  - type: checkboxes
    id: search
    attributes:
      label: Existing issues
      options:
        - label: I searched existing issues and this hasn't been reported yet
          required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
  - type: input
    id: cli
    attributes:
      label: Edition and AI tool
      placeholder: "e.g., local with Claude Code, local with Codex, or hosted web"
  - type: input
    id: os
    attributes:
      label: OS and Node.js version
      placeholder: "e.g., macOS 15 / Node 20.11"
  - type: textarea
    id: doctor
    attributes:
      label: Sanitized diagnostic output
      description: Remove paths, names, emails, job data, tokens, and credentials before pasting
      render: shell
